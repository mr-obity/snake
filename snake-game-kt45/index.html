<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#06100e">
  <meta name="description" content="A polished neon snake arcade game with obstacles and touch controls.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon Snake">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Neon Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #06100e;
      --panel: rgba(12, 27, 23, .76);
      --panel-border: rgba(170, 220, 187, .18);
      --text: #f1fff4;
      --muted: #91afa0;
      --accent: #a6f66e;
      --accent-2: #77d8a0;
      --food: #ff4d58;
      --canvas: #10251b;
      --grid: rgba(170, 220, 187, .075);
      --shadow: rgba(0, 0, 0, .45);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --page: #e7f0e8;
        --panel: rgba(243, 253, 245, .82);
        --panel-border: rgba(42, 95, 58, .18);
        --text: #14301e;
        --muted: #5b7863;
        --canvas: #d9ebd8;
        --grid: rgba(50, 105, 65, .12);
        --shadow: rgba(45, 80, 50, .2);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(166, 246, 110, .11), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(56, 129, 91, .16), transparent 34%),
        var(--page);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    .game-shell {
      width: min(100%, 680px);
      max-height: 100%;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1;
      letter-spacing: -.045em;
      text-shadow: 0 4px 24px rgba(166, 246, 110, .16);
    }

    .score-card {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 190px;
      padding: 10px 15px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 12px 32px var(--shadow);
      text-align: right;
      backdrop-filter: blur(14px);
    }

    .score-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    #score {
      display: block;
      margin-top: -2px;
      color: var(--accent);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .high-score {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .high-score strong { color: var(--text); }

    .hud-divider {
      width: 1px;
      height: 30px;
      background: var(--panel-border);
    }

    .pause-button {
      margin-top: 12px;
      padding: 7px 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--panel-border);
      box-shadow: none;
      font-size: 12px;
    }

    .install-button {
      display: none;
      margin: 12px 0 0 auto;
      padding: 7px 12px;
      color: var(--text);
      background: rgba(166, 246, 110, .12);
      border: 1px solid rgba(166, 246, 110, .3);
      box-shadow: none;
      font-size: 12px;
    }

    .install-button.visible { display: block; }

    .board {
      position: relative;
      padding: 10px;
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 24px 60px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .04);
      backdrop-filter: blur(14px);
    }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 46px);
      justify-content: center;
      gap: 8px;
      margin: 16px auto 0;
    }

    .mobile-controls button {
      padding: 0;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: none;
      font-size: 20px;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .mobile-controls button:active {
      color: #07130e;
      background: var(--accent);
      transform: scale(.95);
    }

    .mobile-controls .up { grid-column: 2; }
    .mobile-controls .left { grid-column: 1; grid-row: 2; }
    .mobile-controls .down { grid-column: 2; grid-row: 2; }
    .mobile-controls .right { grid-column: 3; grid-row: 2; }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      background: var(--canvas);
      touch-action: none;
      box-shadow: inset 0 0 90px rgba(0, 0, 0, .3);
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(4, 14, 10, .78);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay.visible .overlay-card {
      animation: overlayIn .42s cubic-bezier(.2, .85, .3, 1) both;
    }

    @keyframes overlayIn {
      from { opacity: 0; transform: translateY(12px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .overlay-card {
      width: min(82%, 330px);
      padding: 28px;
      border: 1px solid rgba(166, 246, 110, .25);
      border-radius: 18px;
      background: rgba(12, 30, 22, .94);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .34);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .overlay-card h2 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: -.03em;
    }

    .overlay-card p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .overlay-card .eyebrow { margin-bottom: 8px; }

    .overlay-card .final-score {
      display: inline-block;
      color: var(--accent);
      font-size: 34px;
      font-weight: 850;
      line-height: 1;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      color: #0b1c0d;
      background: var(--accent);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(166, 246, 110, .2);
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 13px;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid var(--panel-border);
      border-radius: 5px;
      color: var(--text);
      background: var(--panel);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
      header { align-items: center; }
      .score-card { min-width: 158px; gap: 10px; }
      .hud-divider { height: 26px; }
      .mobile-controls { display: grid; }
      footer { display: block; }
      footer span { display: block; margin-top: 4px; }
    }

    @media (max-height: 700px) and (orientation: landscape) {
      body { place-items: start center; }
      .game-shell { max-width: 860px; }
      header { margin-bottom: 8px; }
      .board { max-width: min(72vh, 600px); margin: 0 auto; }
      .mobile-controls { display: none; }
      footer { margin-top: 8px; }
    }

    @media (pointer: coarse) {
      .mobile-controls { display: grid; }
      .mobile-controls button { min-width: 52px; min-height: 46px; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">Arcade / 001</p>
        <h1>Neon Snake</h1>
      </div>
      <div class="score-card" aria-live="polite">
        <div>
          <span class="score-label">Score</span>
          <span id="score">0</span>
        </div>
        <span class="hud-divider" aria-hidden="true"></span>
        <span class="high-score">Best <strong id="high-score">0</strong></span>
      </div>
    </header>

    <section class="board" aria-label="Snake game">
      <canvas id="game" width="600" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="eyebrow">Run complete</p>
          <h2>Game over</h2>
          <p>You scored <strong class="final-score" id="final-score">0</strong><br>Ready for another run?</p>
          <button id="restart" type="button">Restart game</button>
        </div>
      </div>
    </section>

    <button class="pause-button" id="pause" type="button" aria-pressed="false">Pause <span>(P)</span></button>
    <button class="install-button" id="install" type="button">Install app</button>
    <div class="mobile-controls" aria-label="Touch controls">
      <button class="up" type="button" data-direction="ArrowUp" aria-label="Move up">&uarr;</button>
      <button class="left" type="button" data-direction="ArrowLeft" aria-label="Move left">&larr;</button>
      <button class="down" type="button" data-direction="ArrowDown" aria-label="Move down">&darr;</button>
      <button class="right" type="button" data-direction="ArrowRight" aria-label="Move right">&rarr;</button>
    </div>

    <footer>
      <span>Swipe the board or use the controls to move</span>
      <span>Speed rises as you eat · Avoid the barriers</span>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const highScoreEl = document.getElementById("high-score");
      const finalScoreEl = document.getElementById("final-score");
      const overlay = document.getElementById("overlay");
      const restartButton = document.getElementById("restart");
      const pauseButton = document.getElementById("pause");
      const controlButtons = document.querySelectorAll("[data-direction]");

      const gridSize = 24;
      const cellSize = canvas.width / gridSize;
      const obstacles = [
        { x: 5, y: 5 }, { x: 6, y: 5 }, { x: 7, y: 5 },
        { x: 16, y: 5 }, { x: 17, y: 5 }, { x: 18, y: 5 },
        { x: 5, y: 18 }, { x: 6, y: 18 }, { x: 7, y: 18 },
        { x: 16, y: 18 }, { x: 17, y: 18 }, { x: 18, y: 18 },
        { x: 5, y: 6 }, { x: 5, y: 7 },
        { x: 18, y: 16 }, { x: 18, y: 17 }
      ];
      const directions = {
        ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }
      };

      let snake;
      let food;
      let direction;
      let nextDirection;
      let score;
      let speed;
      let timer;
      let gameOver;
      let paused;
      let movementProgress;
      let eatPulse;
      let deathProgress;
      let particles;
      let touchStart;
      const highScore = Number(localStorage.getItem("neon-snake-high-score")) || 0;
      highScoreEl.textContent = highScore;

      function randomFood() {
        let next;
        do {
          next = {
            x: Math.floor(Math.random() * gridSize),
            y: Math.floor(Math.random() * gridSize)
          };
        } while (snake.some(segment => segment.x === next.x && segment.y === next.y)
          || obstacles.some(obstacle => obstacle.x === next.x && obstacle.y === next.y));
        return next;
      }

      function reset() {
        snake = [
          { x: 12, y: 13 },
          { x: 11, y: 13 },
          { x: 10, y: 13 }
        ];
        direction = { x: 1, y: 0 };
        nextDirection = direction;
        score = 0;
        speed = 145;
        gameOver = false;
        paused = false;
        movementProgress = 1;
        eatPulse = 0;
        deathProgress = 0;
        particles = [];
        food = randomFood();
        scoreEl.textContent = score;
        pauseButton.innerHTML = "Pause <span>(P)</span>";
        pauseButton.setAttribute("aria-pressed", "false");
        overlay.classList.remove("visible");
        clearInterval(timer);
        timer = setInterval(step, speed);
        draw();
      }

      function step() {
        if (paused) return;
        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };

        const hitWall = head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize;
        const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);
        const hitObstacle = obstacles.some(obstacle => obstacle.x === head.x && obstacle.y === head.y);
        if (hitWall || hitSelf || hitObstacle) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          if (score > Number(highScoreEl.textContent)) {
            highScoreEl.textContent = score;
            localStorage.setItem("neon-snake-high-score", score);
          }
          eatPulse = 1;
          for (let i = 0; i < 14; i++) {
            const angle = Math.random() * Math.PI * 2;
            particles.push({
              x: head.x * cellSize + cellSize / 2,
              y: head.y * cellSize + cellSize / 2,
              vx: Math.cos(angle) * (1 + Math.random() * 2),
              vy: Math.sin(angle) * (1 + Math.random() * 2),
              life: 1
            });
          }
          speed = Math.max(62, speed - 5);
          clearInterval(timer);
          timer = setInterval(step, speed);
          food = randomFood();
        } else {
          snake.pop();
        }
        movementProgress = 0;
      }

      function endGame() {
        gameOver = true;
        clearInterval(timer);
        finalScoreEl.textContent = score;
        overlay.classList.add("visible");
        deathProgress = 0;
      }

      function togglePause() {
        if (gameOver) return;
        paused = !paused;
        pauseButton.innerHTML = paused ? "Resume <span>(P)</span>" : "Pause <span>(P)</span>";
        pauseButton.setAttribute("aria-pressed", String(paused));
        if (paused) {
          clearInterval(timer);
        } else {
          timer = setInterval(step, speed);
        }
      }

      function changeDirection(key) {
        const requested = directions[key] || directions[key.toLowerCase()];
        if (!requested || gameOver) return;
        if (requested.x !== -direction.x || requested.y !== -direction.y) {
          nextDirection = requested;
        }
      }

      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, r);
      }

      function draw(time = performance.now()) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const styles = getComputedStyle(document.documentElement);
        const canvasColor = styles.getPropertyValue("--canvas");
        ctx.fillStyle = canvasColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const atmosphere = ctx.createRadialGradient(130, 80, 20, 300, 300, 440);
        atmosphere.addColorStop(0, "rgba(121, 190, 94, .14)");
        atmosphere.addColorStop(.55, "rgba(20, 62, 37, .05)");
        atmosphere.addColorStop(1, "rgba(0, 0, 0, .28)");
        ctx.fillStyle = atmosphere;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(187, 224, 143, .045)";
        for (let i = 0; i < 95; i++) {
          const x = (i * 97) % canvas.width;
          const y = (i * 53) % canvas.height;
          ctx.fillRect(x, y, 1.5, 1.5);
        }

        ctx.strokeStyle = styles.getPropertyValue("--grid");
        ctx.lineWidth = 1;
        for (let i = 1; i < gridSize; i++) {
          const point = i * cellSize + .5;
          ctx.beginPath();
          ctx.moveTo(point, 0);
          ctx.lineTo(point, canvas.height);
          ctx.moveTo(0, point);
          ctx.lineTo(canvas.width, point);
          ctx.stroke();
        }

        obstacles.forEach(obstacle => {
          const inset = 2;
          const x = obstacle.x * cellSize + inset;
          const y = obstacle.y * cellSize + inset;
          ctx.shadowColor = "rgba(0, 0, 0, .38)";
          ctx.shadowBlur = 8;
          const stone = ctx.createLinearGradient(x, y, x, y + cellSize);
          stone.addColorStop(0, "#6e9a61");
          stone.addColorStop(1, "#34583b");
          ctx.fillStyle = stone;
          roundedRect(x, y, cellSize - inset * 2, cellSize - inset * 2, 5);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(200, 240, 177, .28)";
          ctx.lineWidth = 1;
          roundedRect(x + .5, y + .5, cellSize - inset * 2 - 1, cellSize - inset * 2 - 1, 5);
          ctx.stroke();
        });

        const foodScale = 1 + Math.sin(time / 180) * .04 + eatPulse * .18;
        const foodX = food.x * cellSize + cellSize / 2;
        const foodY = food.y * cellSize + cellSize / 2;
        ctx.fillStyle = "rgba(0, 0, 0, .25)";
        ctx.beginPath();
        ctx.ellipse(foodX, foodY + cellSize * .29, cellSize * .3 * foodScale, cellSize * .1, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = "rgba(255, 61, 72, .7)";
        ctx.shadowBlur = 18;
        const apple = ctx.createRadialGradient(foodX - 4, foodY - 6, 2, foodX, foodY, cellSize * .4);
        apple.addColorStop(0, "#ffb0a0");
        apple.addColorStop(.25, "#ff5f61");
        apple.addColorStop(1, "#ad182d");
        ctx.fillStyle = apple;
        ctx.beginPath();
        ctx.ellipse(foodX, foodY, cellSize * .28 * foodScale, cellSize * .32 * foodScale, -.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#5d2d1d";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(foodX, foodY - cellSize * .27);
        ctx.quadraticCurveTo(foodX + 1, foodY - cellSize * .4, foodX + 4, foodY - cellSize * .42);
        ctx.stroke();
        ctx.fillStyle = "#91d46f";
        ctx.beginPath();
        ctx.ellipse(foodX + 6, foodY - cellSize * .35, 7, 3, -.35, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((segment, index) => {
          const visualOffset = index === 0 ? 1 - movementProgress : 0;
          const x = (segment.x - direction.x * visualOffset) * cellSize + 2;
          const y = (segment.y - direction.y * visualOffset) * cellSize + 2;
          const inset = Math.min(5, 2 + index * .18);
          ctx.fillStyle = "rgba(0, 0, 0, .3)";
          ctx.beginPath();
          ctx.ellipse(x + cellSize / 2, y + cellSize - 1, cellSize * .36, cellSize * .1, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowColor = "rgba(92, 245, 111, .45)";
          ctx.shadowBlur = index === 0 ? 16 : 9;
          const body = ctx.createLinearGradient(x, y, x, y + cellSize);
          body.addColorStop(0, index === 0 ? "#e3ffb0" : "#b8ed79");
          body.addColorStop(.35, index === 0 ? "#75d75e" : "#4cae50");
          body.addColorStop(1, "#1e6b3c");
          ctx.fillStyle = body;
          roundedRect(x + inset / 2, y + inset / 2, cellSize - inset, cellSize - inset, 9);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(255, 255, 255, .22)";
          roundedRect(x + 5, y + 4, cellSize * .28, 3, 2);
          ctx.fill();
          if (index === 0) {
            const eyeY = y + cellSize * .34;
            const eyeX = x + cellSize * .34;
            ctx.fillStyle = "#f4ffe7";
            ctx.beginPath();
            ctx.arc(eyeX, eyeY, 3, 0, Math.PI * 2);
            ctx.arc(x + cellSize * .66, eyeY, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#182918";
            ctx.beginPath();
            ctx.arc(eyeX + direction.x * 1.2, eyeY + direction.y * 1.2, 1.5, 0, Math.PI * 2);
            ctx.arc(x + cellSize * .66 + direction.x * 1.2, eyeY + direction.y * 1.2, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        particles.forEach(particle => {
          ctx.globalAlpha = particle.life;
          ctx.fillStyle = "#e7ffac";
          ctx.shadowColor = "#a6f66e";
          ctx.shadowBlur = 9;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        const vignette = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.width * .25, canvas.width / 2, canvas.height / 2, canvas.width * .7);
        vignette.addColorStop(.65, "rgba(0, 0, 0, 0)");
        vignette.addColorStop(1, "rgba(0, 0, 0, .35)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.shadowBlur = 0;
      }

      let lastFrame = performance.now();
      function animate(time) {
        const elapsed = Math.min(50, time - lastFrame);
        lastFrame = time;
        if (!paused && !gameOver) {
          movementProgress = Math.min(1, movementProgress + elapsed / speed);
        }
        eatPulse = Math.max(0, eatPulse - elapsed / 280);
        deathProgress = Math.min(1, deathProgress + elapsed / 420);
        particles = particles.filter(particle => {
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.life -= elapsed / 520;
          return particle.life > 0;
        });
        draw(time);
        requestAnimationFrame(animate);
      }

      document.addEventListener("keydown", event => {
        if (event.key.toLowerCase() === "p") {
          event.preventDefault();
          togglePause();
          return;
        }
        if (!directions[event.key] && !directions[event.key.toLowerCase()]) return;
        event.preventDefault();
        changeDirection(event.key);
      });

      controlButtons.forEach(button => {
        button.addEventListener("click", () => changeDirection(button.dataset.direction));
      });

      canvas.addEventListener("touchstart", event => {
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });

      canvas.addEventListener("touchend", event => {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStart.x;
        const deltaY = touch.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 24) return;
        const key = Math.abs(deltaX) > Math.abs(deltaY)
          ? (deltaX > 0 ? "ArrowRight" : "ArrowLeft")
          : (deltaY > 0 ? "ArrowDown" : "ArrowUp");
        changeDirection(key);
      }, { passive: true });

      restartButton.addEventListener("click", reset);
      pauseButton.addEventListener("click", togglePause);
      reset();
      requestAnimationFrame(animate);
    })();

    (() => {
      const installButton = document.getElementById("install");
      let installPrompt;

      window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        installPrompt = event;
        installButton.classList.add("visible");
      });

      installButton.addEventListener("click", async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installButton.classList.remove("visible");
      });

      window.addEventListener("appinstalled", () => {
        installButton.classList.remove("visible");
      });

      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        navigator.serviceWorker.register("./sw.js").catch(() => {
          // The game remains fully playable if offline caching is unavailable.
        });
      }
    })();
  </script>
